name: Validate Physics Constants Data

# وفق القسم 19-ب من قواعد المشروع: يُشغَّل عند كل PR يمس /constants أو /schemas
# أو /scripts، ولا يُسمح بالدمج إذا فشل أي بند علمي، بصرف النظر عن نجاح باقي الكود.

on:
  pull_request:
    paths:
      - "constants/**"
      - "schemas/**"
      - "sources/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "constants/**"
      - "schemas/**"
      - "sources/**"
      - "scripts/**"
  workflow_dispatch: {}

jobs:
  validate-schema:
    name: "1. JSON Schema validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema --break-system-packages
      - name: Run validate_schema.py
        run: python3 scripts/validate_schema.py

  validate-consistency:
    name: "2. Cross-consistency check (القسم 9-ب — إلزامي)"
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validate_consistency.py
        run: python3 scripts/validate_consistency.py --n-sigma 3

  # مكانان محجوزان لبنود القسم 19-ب الأخرى؛ يُفعَّلان عند إضافة السكربتات:
  # validate-dimensions:
  #   name: "3. Dimensional analysis check"
  #   steps: [ python3 scripts/validate_dimensions.py ]
  #
  # link-check:
  #   name: "4. Link check (الروابط المؤرشفة فقط، القسم 27)"
  #   steps: [ ... ]

  gate:
    name: "بوابة الدمج النهائية"
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-consistency]
    if: always()
    steps:
      - name: Fail if any check failed
        run: |
          if [ "${{ needs.validate-schema.result }}" != "success" ] || \
             [ "${{ needs.validate-consistency.result }}" != "success" ]; then
            echo "فشل أحد بنود التحقق العلمي — DO NOT MERGE (القسم 19-ب و22)."
            exit 1
          fi
          echo "كل الفحوصات نجحت."
